<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Listagem de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <span class="tag">GERENCIAMENTO</span>
            <h1>Cadastro de Produtos</h1>
            <p>Adicione produtos e gerencie sua lista de forma simples.</p>
        </header>

        <section class="card">
            <h2>Novo produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" placeholder="Ex.: Arroz" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco" placeholder="Ex.: 25.90" step="0.01" min="0.01" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Ex.: 10" min="1" required>
                </div>

                <button type="submit">+ Adicionar produto</button>
            </form>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <div>
                    <h2>Lista de produtos</h2>
                    <p id="contador">0 produtos cadastrados</p>
                </div>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <p id="vazia">Nenhum produto cadastrado ainda.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
